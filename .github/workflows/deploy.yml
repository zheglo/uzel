name: Deploy uzel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: uzel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/uzel_deploy
          chmod 600 ~/.ssh/uzel_deploy

          ssh -i ~/.ssh/uzel_deploy \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" <<'EOF'
          set -e
          cd /var/www/uzel

          if [ ! -d repo/.git ]; then
            git clone git@github.com:zheglo/uzel.git repo
          fi

          cd repo
          git fetch origin master
          git reset --hard origin/master

          corepack pnpm@12.14.0 install --frozen-lockfile
          corepack pnpm@12.14.0 build

          pm2 startOrRestart /var/www/uzel/repo/ecosystem.config.cjs --update-env
          EOF